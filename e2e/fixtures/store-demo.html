<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Visual Moods — curated gradients</title>
    <!-- Store-listing demo page for scripts/take-store-screenshots.mjs.
         Not used by any e2e test; exists purely so the Microsoft Edge
         Add-ons / Chrome Web Store screenshots show a presentable gallery
         instead of the red/blue/green squares from page-with-images.html.
         All images are inline SVG data URIs so the fixture server needs no
         binary assets. -->
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background: #f7f7f5;
        color: #1a1a1a;
      }
      header {
        padding: 30px 40px 6px;
      }
      h1 {
        font-size: 26px;
        font-weight: 700;
        margin: 0;
        letter-spacing: -0.02em;
      }
      p.sub {
        color: #77777a;
        margin: 6px 0 14px;
        font-size: 13px;
      }
      .tags {
        display: flex;
        gap: 8px;
      }
      .tag {
        font-size: 11px;
        padding: 4px 12px;
        border-radius: 999px;
        background: #fff;
        border: 1px solid #e6e6e3;
        color: #55555a;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        padding: 18px 40px 40px;
      }
      .card {
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      }
      .card img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>

      <p class="sub">Curated gradients · refreshed daily · free to download</p>
      <div class="tags">
        <span class="tag">landscape</span>
        <span class="tag">abstract</span>
        <span class="tag">wallpaper</span>
        <span class="tag">pastel</span>
      </div>
    </header>

         the progress overlay stays up long enough to be captured in the
         store screenshot. Tinted + labelled so mid-scroll captures never
         show a blank region. -->

      style="
        height: 2200px;
        background: linear-gradient(180deg, #fdfcfb, #e2d1c3);
        display: flex;
